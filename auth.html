<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Microsoft Authentication</title>

    <script
        src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"
    ></script>

    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: #ffffff;
            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 255, 255, 0.08),
                    transparent 40%
                ),
                #000000;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.06),
                    rgba(255, 255, 255, 0.015)
                );
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 24px;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .microsoft-logo {
            display: grid;
            grid-template-columns: 18px 18px;
            grid-template-rows: 18px 18px;
            gap: 3px;
            width: max-content;
            margin: 0 auto 24px;
        }

        .microsoft-logo span:nth-child(1) {
            background: #f25022;
        }

        .microsoft-logo span:nth-child(2) {
            background: #7fba00;
        }

        .microsoft-logo span:nth-child(3) {
            background: #00a4ef;
        }

        .microsoft-logo span:nth-child(4) {
            background: #ffb900;
        }

        h1 {
            margin: 0;
            font-size: 23px;
            letter-spacing: -0.035em;
        }

        p {
            margin: 12px 0 0;
            color: #96969d;
            font-size: 13px;
            line-height: 1.6;
        }

        .loader {
            width: 34px;
            height: 34px;
            margin: 26px auto 0;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .error {
            display: none;
            margin-top: 22px;
            padding: 13px;
            color: #ffb0b9;
            background: rgba(255, 92, 108, 0.08);
            border: 1px solid rgba(255, 92, 108, 0.3);
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.5;
            text-align: left;
        }

        .error.visible {
            display: block;
        }

        .back-button {
            display: none;
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            color: #000000;
            background: #ffffff;
            border: 0;
            border-radius: 11px;
            cursor: pointer;
            font: inherit;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .back-button.visible {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<main class="auth-card">

    <div class="microsoft-logo" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <h1>Microsoft authentication</h1>

    <p id="authStatus">
        Preparing corporate sign-in...
    </p>

    <div id="authLoader" class="loader"></div>

    <div
        id="authError"
        class="error"
        role="alert"
    ></div>

    <button
        id="backButton"
        class="back-button"
        type="button"
    >
        Return to registration
    </button>

</main>

<script>
    /*
     * MICROSOFT ENTRA CONFIGURATION
     *
     * Use:
     * - Application (client) ID
     * - Directory (tenant) ID
     */
    const MICROSOFT_CLIENT_ID =
        "d6368c0b-a4a5-4e64-a36c-f56c2aa373ce";

    const MICROSOFT_TENANT_ID =
        "73d27a24-8a3e-417d-b34c-b2dc4ba5c26f";

    /*
     * Because this code is inside auth.html, this produces:
     *
     * http://127.0.0.1:5500/auth.html
     *
     * or:
     *
     * http://localhost:5500/auth.html
     */
    const MICROSOFT_REDIRECT_URI =
        window.location.origin +
        window.location.pathname;

    const INDEX_URL =
        new URL(
            "./index.html",
            MICROSOFT_REDIRECT_URI
        ).href;

    const PROFILE_STORAGE_KEY =
        "gdm_microsoft_profile";

    const LOGIN_SUCCESS_KEY =
        "gdm_microsoft_login_success";

    const authStatus =
        document.getElementById("authStatus");

    const authLoader =
        document.getElementById("authLoader");

    const authError =
        document.getElementById("authError");

    const backButton =
        document.getElementById("backButton");

    let microsoftApplication = null;

    const microsoftConfiguration = {
        auth: {
            clientId:
                MICROSOFT_CLIENT_ID,

            authority:
                "https://login.microsoftonline.com/" +
                MICROSOFT_TENANT_ID,

            redirectUri:
                MICROSOFT_REDIRECT_URI,

            postLogoutRedirectUri:
                INDEX_URL,

            navigateToLoginRequestUrl:
                false
        },

        cache: {
            cacheLocation:
                "sessionStorage",

            storeAuthStateInCookie:
                false
        }
    };

    const loginRequest = {
        scopes: [
            "openid",
            "profile",
            "email",
            "User.Read"
        ],

        prompt:
            "select_account"
    };

    function setStatus(message) {
        authStatus.textContent = message;
    }

    function showError(error) {
        console.error(
            "Microsoft authentication error:",
            error
        );

        authLoader.style.display = "none";

        authError.textContent =
            error?.message ||
            "Microsoft authentication could not be completed.";

        authError.classList.add("visible");
        backButton.classList.add("visible");

        setStatus(
            "Authentication was not completed."
        );
    }

    /*
     * Do not use strict UUID validation here.
     *
     * Application IDs and tenant IDs are GUIDs, but overly
     * strict validation expressions may reject valid IDs.
     */
    function validateConfiguration() {
        if (
            !MICROSOFT_CLIENT_ID ||
            MICROSOFT_CLIENT_ID.includes(
                "PASTE_"
            )
        ) {
            throw new Error(
                "Configure the Microsoft Application (client) ID in auth.html."
            );
        }

        if (
            !MICROSOFT_TENANT_ID ||
            MICROSOFT_TENANT_ID.includes(
                "PASTE_"
            )
        ) {
            throw new Error(
                "Configure the Microsoft Directory (tenant) ID in auth.html."
            );
        }

        if (
            window.location.protocol === "file:"
        ) {
            throw new Error(
                "Open the website through Live Server. Microsoft authentication does not work with file://."
            );
        }

        if (!window.msal) {
            throw new Error(
                "The MSAL library was not loaded. Check the CDN, network connection or corporate proxy."
            );
        }
    }

    function createInitialsImage(name) {
        const initials =
            String(name || "User")
                .split(/\s+/)
                .filter(Boolean)
                .slice(0, 2)
                .map(part =>
                    part.charAt(0).toUpperCase()
                )
                .join("");

        const canvas =
            document.createElement("canvas");

        canvas.width = 160;
        canvas.height = 160;

        const context =
            canvas.getContext("2d");

        context.fillStyle = "#202020";
        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        context.fillStyle = "#ffffff";
        context.font =
            "600 54px Arial";

        context.textAlign =
            "center";

        context.textBaseline =
            "middle";

        context.fillText(
            initials,
            canvas.width / 2,
            canvas.height / 2
        );

        return canvas.toDataURL(
            "image/png"
        );
    }

    function blobToDataUrl(blob) {
        return new Promise(
            (resolve, reject) => {
                const reader =
                    new FileReader();

                reader.onload =
                    () => resolve(
                        reader.result
                    );

                reader.onerror =
                    () => reject(
                        new Error(
                            "The Microsoft profile photo could not be read."
                        )
                    );

                reader.readAsDataURL(blob);
            }
        );
    }

    async function acquireGraphToken(
        account,
        redirectResult
    ) {
        if (
            redirectResult?.accessToken
        ) {
            return redirectResult.accessToken;
        }

        try {
            const tokenResponse =
                await microsoftApplication
                    .acquireTokenSilent({
                        account,
                        scopes: [
                            "User.Read"
                        ]
                    });

            return tokenResponse.accessToken;

        } catch (error) {
            /*
             * If silent token acquisition is not possible,
             * Microsoft will perform another redirect.
             */
            await microsoftApplication
                .acquireTokenRedirect({
                    account,
                    scopes: [
                        "User.Read"
                    ]
                });

            return null;
        }
    }

    async function getMicrosoftProfile(
        accessToken
    ) {
        const response = await fetch(
            "https://graph.microsoft.com/v1.0/me" +
            "?$select=id,displayName,mail,userPrincipalName",
            {
                headers: {
                    Authorization:
                        `Bearer ${accessToken}`
                }
            }
        );

        if (!response.ok) {
            throw new Error(
                "Microsoft Graph could not load the user profile."
            );
        }

        return response.json();
    }

    async function getMicrosoftPhoto(
        accessToken,
        displayName
    ) {
        const response = await fetch(
            "https://graph.microsoft.com/v1.0/me/photo/$value",
            {
                headers: {
                    Authorization:
                        `Bearer ${accessToken}`
                }
            }
        );

        if (!response.ok) {
            return createInitialsImage(
                displayName
            );
        }

        const photoBlob =
            await response.blob();

        return blobToDataUrl(
            photoBlob
        );
    }

    async function completeAuthentication(
        account,
        redirectResult
    ) {
        microsoftApplication.setActiveAccount(
            account
        );

        setStatus(
            "Loading your Microsoft profile..."
        );

        const accessToken =
            await acquireGraphToken(
                account,
                redirectResult
            );

        /*
         * acquireTokenRedirect started another redirect.
         */
        if (!accessToken) {
            return;
        }

        const profile =
            await getMicrosoftProfile(
                accessToken
            );

        const displayName =
            profile.displayName ||
            account.name ||
            "Microsoft user";

        const email =
            profile.mail ||
            profile.userPrincipalName ||
            account.username ||
            "";

        const photo =
            await getMicrosoftPhoto(
                accessToken,
                displayName
            );

        const storedProfile = {
            id:
                profile.id || account.homeAccountId,

            displayName,
            email,
            photo,

            tenantId:
                account.tenantId || ""
        };

        sessionStorage.setItem(
            PROFILE_STORAGE_KEY,
            JSON.stringify(storedProfile)
        );

        sessionStorage.setItem(
            LOGIN_SUCCESS_KEY,
            "true"
        );

        setStatus(
            "Authentication successful. Returning to the registration form..."
        );

        window.location.replace(
            INDEX_URL
        );
    }

    async function startAuthentication() {
        try {
            validateConfiguration();

            microsoftApplication =
                new window.msal
                    .PublicClientApplication(
                        microsoftConfiguration
                    );

            const query =
                new URLSearchParams(
                    window.location.search
                );

            const action =
                query.get("action");

            const redirectResult =
                await microsoftApplication
                    .handleRedirectPromise();

            const accounts =
                microsoftApplication
                    .getAllAccounts();

            const account =
                redirectResult?.account ||
                microsoftApplication
                    .getActiveAccount() ||
                accounts[0] ||
                null;

            /*
             * Logout request from index.html.
             */
            if (action === "logout") {
                sessionStorage.removeItem(
                    PROFILE_STORAGE_KEY
                );

                sessionStorage.removeItem(
                    LOGIN_SUCCESS_KEY
                );

                if (account) {
                    await microsoftApplication
                        .logoutRedirect({
                            account,
                            postLogoutRedirectUri:
                                INDEX_URL
                        });

                    return;
                }

                window.location.replace(
                    INDEX_URL
                );

                return;
            }

            /*
             * Microsoft returned successfully.
             */
            if (account) {
                await completeAuthentication(
                    account,
                    redirectResult
                );

                return;
            }

            /*
             * No account exists yet. Open the official
             * Microsoft login page.
             */
            setStatus(
                "Redirecting to Microsoft..."
            );

            await microsoftApplication
                .loginRedirect(
                    loginRequest
                );

        } catch (error) {
            showError(error);
        }
    }

    backButton.addEventListener(
        "click",
        () => {
            window.location.href =
                INDEX_URL;
        }
    );

    startAuthentication();
</script>

</body>
</html>
